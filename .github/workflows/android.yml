name: Android build

on:
  push:
    branches:
      - master
      - next
      - 'next*'

jobs:
  android:
    name: Android build job
    runs-on: ubuntu-22.04
    env:
      ORIGIN: ppa:bastif/qt-android
      QT_ANDROID_PACKAGE: qt-android-6.5
      ANDROID_SDK_CMDLINE_TOOLS_ZIP: commandlinetools-linux-8512546_latest.zip
      ANDROID_SDK_CMDLINE_TOOLS_SHA1: 5e7bf2dd563d34917d32f3c5920a85562a795c93
      ANDROID_BUILD_TOOLS_VER: 33.0.0
      ANDROID_PLATFORM_VER: android-33
      ANDROID_NDK_ZIP: android-ndk-r25b-linux.zip
      ANDROID_NDK_VERSION: 25.1.8937393
      ANDROID_NDK_SHA1: e27dcb9c8bcaa77b78ff68c3f23abcf6867959eb

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - run: git fetch --prune --unshallow --tags

      - name: Set environment variables
        run: |
          echo "ANDROID_NDK_MOUNT_DIR=${HOME}/android-ndk" >> $GITHUB_ENV
          echo "LAST_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "LAST_COMMIT_DATE=$(git log -1 --date=format:%Y%m%d --format=%cd)" >> $GITHUB_ENV

      - name: Add qt-android repo from 'ppa:bastif/qt-android'
        run: |
          sudo add-apt-repository "$ORIGIN" -y
          sudo apt-get update

      - name: Install ${{ env.QT_ANDROID_PACKAGE }}
        run: sudo apt -y --fix-broken install ${QT_ANDROID_PACKAGE}-arm64-v8a ${QT_ANDROID_PACKAGE}-armeabi-v7a ${QT_ANDROID_PACKAGE}-x86 ${QT_ANDROID_PACKAGE}-x86-64

      - name: Set environment variables for use when configuring the project
        run: |
          PACKAGES_ALL="$(dpkg-query -W -f '${Package}\n' | grep "${QT_ANDROID_PACKAGE}")"
          PACKAGES_FOR_ABI="$(echo "${PACKAGES_ALL}" | grep -v "${QT_ANDROID_PACKAGE}-common" | grep -v "${QT_ANDROID_PACKAGE}-host")"
          QT_ANDROID_ABIS="$(echo "${PACKAGES_FOR_ABI}" | sed -e "s/${QT_ANDROID_PACKAGE}-//" -e "s/x86-64/x86_64/" | tr '\n' ';' | sed "s/;$//")"
          PACKAGE_FOR_BUILD="$(echo "${PACKAGES_FOR_ABI}" | head -n1)"
          QT_INSTALL_BINDIR="$(dirname "$(dpkg -S "bin/qmake" | grep 'bin/qmake$' | grep "$PACKAGE_FOR_BUILD:" | cut -f 2 -d " ")")"
          
          echo "QT_INSTALL_BINDIR=${QT_INSTALL_BINDIR}" >> $GITHUB_ENV
          echo "QT_ANDROID_ABIS=${QT_ANDROID_ABIS}" >> $GITHUB_ENV

          for abi in $(echo "$QT_ANDROID_ABIS" | tr ';' ' '); do
              if dpkg -S "QtInstallPaths.cmake" > /dev/null; then
                  QT_CONFIG_FILE_PATH="$(dpkg -S "QtInstallPaths.cmake" | grep "${QT_ANDROID_PACKAGE}-${abi/x86_64/x86-64}:" | cut -f 2 -d " ")"
                  QT_PATH_ANDROID_ABI="$(grep '^set(QT_BUILD_INTERNALS_RELOCATABLE_INSTALL_PREFIX' "${QT_CONFIG_FILE_PATH}" | cut -f 2 -d '"')"
              else
                  QT_PATH_ANDROID_ABI="/usr/lib/${QT_ANDROID_PACKAGE}-${abi/x86_64/x86-64}"
              fi
              abi_macro_name=$(echo "$abi" | tr '-' '_')
              echo "QT_PATH_ANDROID_ABI_${abi_macro_name}=${QT_PATH_ANDROID_ABI}" >> $GITHUB_ENV
              echo "QT_ANDROID_PATH_CMAKE_DIR_${abi_macro_name}=${QT_PATH_ANDROID_ABI}/lib/cmake" >> $GITHUB_ENV
          done

      - name: Build with qt-cmake
        run: |
          mkdir -p build-android && cd build-android
          
          # 1. Fire configuration framework variables targeting only your S23 architecture
          ${{ env.QT_INSTALL_BINDIR }}/qt-cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -march=armv8-a+crypto" \
            -DQT_ANDROID_ABIS="arm64-v8a" \
            -DQT_PATH_ANDROID_ABI_arm64_v8a="${{ env.QT_PATH_ANDROID_ABI_arm64_v8a }}" \
            -DQT_ANDROID_PATH_CMAKE_DIR_arm64_v8a="${{ env.QT_ANDROID_PATH_CMAKE_DIR_arm64_v8a }}" \
            ..
          
          # 2. Hard override every single generated properties layout directory block with the aapt2 runtime version flag before compilation runs
          find . -name "gradle.properties" -exec sh -c 'echo "android.aapt2Version=8.6.1-11315950" >> {}' \;
          
          # 3. Fire compilation rule targets safely
          cmake --build . --target welle-io_make_apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: welle-io-s23-optimized
          path: 'build-android/**/*.apk'
